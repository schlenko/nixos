# ─────────────────────────────────────────────
# btop
# ─────────────────────────────────────────────

# General
update_ms = 1000
truecolor = True
rounded_corners = True
graph_symbol = "braille"

# ─────────────────────────────────────────────
# CPU
# ─────────────────────────────────────────────

# Show total CPU usage in the main graph
cpu_graph_upper = "total"

# Show I/O wait below it
cpu_graph_lower = "iowait"

# Keep individual CPU cores visible
show_coretemp = True

# Show CPU frequency
show_cpu_freq = True

# ─────────────────────────────────────────────
# Memory
# ─────────────────────────────────────────────

# No memory graph, just the meter/value
mem_graphs = False

# Show swap
show_swap = True

# ─────────────────────────────────────────────
# GPU
# ─────────────────────────────────────────────

# Let btop detect available GPUs
shown_gpus = "auto"

# Show GPU information
show_gpu_info = "Auto"

# ─────────────────────────────────────────────
# Processes
# ─────────────────────────────────────────────

proc_sorting = "cpu direct"
proc_reversed = False
proc_tree = False
proc_per_core = False
proc_mem_bytes = False

# ─────────────────────────────────────────────
# Layout
# ─────────────────────────────────────────────

shown_boxes = "cpu mem gpu0 gpu1 proc"

# Don't overwrite the Nix-managed configuration
save_config_on_exit = False
