[general]
framerate = 120
bars = 32

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average
reverse = 0

[smoothing]
noise_reduction = 20
monstercat = 1
waves = 1