# name :: command :: icon
# icon = Papirus icon name, or a PNG name in ./icons (without .png)

Windows VM   :: virsh -c qemu:///system start win11; looking-glass-client  :: virt-manager
Stop VM      :: virsh -c qemu:///system shutdown win11                     :: system-shutdown
Looking Glass:: looking-glass-client                                       :: video-display
MSSQL start  :: sudo systemctl start docker-mssql.service                  :: database
Rebuild      :: kitty -- sudo nixos-rebuild switch --flake /etc/nixos#nixos :: system-software-update
Lazygit      :: kitty -- lazygit --path /etc/nixos                         :: git