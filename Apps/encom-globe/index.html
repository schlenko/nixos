
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ENCOM Globe</title>

    <link href="styles.css" rel="stylesheet">

    <script src="include/Detector.js"></script>
    <script src="data.js"></script>
    <script src="grid.js"></script>
    <script src="build/encom-globe.js"></script>

    <script>
        var globe;
        var animationStarted = false;

        function palette(name) {
            return getComputedStyle(document.documentElement)
                .getPropertyValue(name)
                .trim();
        }

        function createGlobe() {
            if (globe) {
                globe.destroy(function () {
                    globe = null;
                    createGlobe();
                });
                return;
            }

            globe = new ENCOM.Globe(
                window.innerWidth,
                window.innerHeight,
                {
                    font: "Inconsolata",
                    data: data.slice(),
                    tiles: grid.tiles,

                    baseColor: palette("--accent"),
                    markerColor: palette("--accent"),
                    pinColor: palette("--pin"),
                    satelliteColor: palette("--satellite"),

                    scale: 1.0,
                    dayLength: 28000,
                    introLinesDuration: 2000,
                    maxPins: 500,
                    maxMarkers: 4,
                    viewAngle: 0.1
                }
            );

            document.getElementById("globe").appendChild(
                globe.domElement
            );

            globe.init(start);
        }

        function onWindowResize() {
            if (!globe) return;

            globe.camera.aspect =
                window.innerWidth / window.innerHeight;

            globe.camera.updateProjectionMatrix();

            globe.renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }

        function animate() {
            if (globe) {
                globe.tick();
            }

            requestAnimationFrame(animate);
        }

        function start() {
            if (animationStarted) return;
            animationStarted = true;

            animate();

            // Default satellite constellation.
            setTimeout(function () {
                if (!globe) return;

                var constellation = [];

                var opts = {
                    coreColor: palette("--satellite"),
                    numWaves: 8
                };

                for (var i = 0; i < 2; i++) {
                    for (var j = 0; j < 3; j++) {
                        constellation.push({
                            lat: 50 * i - 30 + 15 * Math.random(),
                            lon: 120 * j - 120 + 30 * i,
                            altitude: 1.3
                        });
                    }
                }

                globe.addConstellation(constellation, opts);
            }, 4000);

            // Default globe markers.
            setTimeout(function () {
                if (!globe) return;

                globe.addMarker(49.25, -123.1, "Vancouver");
                globe.addMarker(
                    35.6895,
                    129.69171,
                    "Tokyo",
                    true
                );
            }, 2000);

            // Periodically add a random pin.
            setInterval(function () {
                if (!globe) return;

                var lat = Math.random() * 180 - 90;
                var lon = Math.random() * 360 - 180;

                globe.addPin(
                    lat,
                    lon,
                    "Test " + Math.floor(Math.random() * 100)
                );
            }, 5000);
        }

        window.addEventListener(
            "resize",
            onWindowResize,
            false
        );

        window.WebFontConfig = {
            google: {
                families: ["Inconsolata"]
            },
            active: function () {
                createGlobe();
            },
            inactive: function () {
                createGlobe();
            }
        };
    </script>

    <script
        src="https://ajax.googleapis.com/ajax/libs/webfont/1.4.7/webfont.js"
        async>
    </script>
</head>

<body>
    <div id="container">
        <div id="globe"></div>

        <div class="header" id="header-top">
            <div class="header-left-section">
                CENTRAL SYSTEM DATA ...
                <span class="alt-1">LAUNCH ENCOM GLOBALIZATION</span>
            </div>

            <div class="header-right-section">
                OIA | 012
            </div>
        </div>

        <div class="header" id="header-bottom">
            <div class="header-left-section">
                TOUCHPOINT KEYBOARD ...
                <span class="alt-1">INTERACTION SEQUENCING</span>
            </div>

            <div class="header-right-section">
                SYS | O12
            </div>
        </div>

        <div
            class="header-animator"
            id="header-animator-inside">
        </div>

        <div
            class="header-animator"
            id="header-animator-outside">
        </div>
    </div>

    <script>
        if (!Detector.webgl) {
            Detector.addGetWebGLMessage({
                parent: document.getElementById("container")
            });
        }
    </script>
</body>
</html>
